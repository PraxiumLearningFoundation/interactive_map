name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify dependency lockfile
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate JSON files
        run: |
          for f in $(find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*"); do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Check public map JavaScript syntax
        run: |
          node --check map.js
          node --check network-data.js

      - name: Check admin-editor/app.js syntax
        run: node --check admin-editor/app.js

      - name: Check categories.js / categories.legacy.js syntax
        run: |
          node --check categories.legacy.js
          node -e "JSON.parse(require('fs').readFileSync('categories.json', 'utf8'))"

      - name: Check api/ function syntax
        run: |
          for f in api/*.js api/_lib/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Check admin/ front-end syntax
        run: |
          node --check admin/admin.js
          node --check admin/admin-auth.js

      - name: Run api/ unit tests (mocked Gist backend)
        run: node test/api.test.js

      - name: Run public map data tests
        run: |
          node test/public-assets.test.js
          node test/network-data.test.js
