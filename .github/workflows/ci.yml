name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify dependency lockfile
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        # Production-only: the root project ships zero runtime npm dependencies
        # (the public map loads Leaflet from a CDN). electron/electron-builder
        # are devDependencies for the desktop packaging tool only — never
        # shipped to the deployed map/admin/API — so their transitive
        # vulnerabilities shouldn't block every unrelated PR.
        run: npm audit --omit=dev --audit-level=high

      - name: Install api/ dependencies
        # The Azure Functions API has its own package.json (@azure/functions is
        # its one real runtime dependency), separate from the root project.
        run: cd api && npm ci --ignore-scripts

      - name: Audit api/ dependencies
        run: cd api && npm audit --omit=dev --audit-level=high

      - name: Validate JSON files
        run: |
          for f in $(find . -name "*.json" -not -path "./node_modules/*" -not -path "./api/node_modules/*" -not -path "./.git/*"); do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Syntax checks and unit/API tests (npm run validate)
        # Same command developers run locally, so CI can't drift from it.
        run: npm run validate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (map + admin portal)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
