name: Azure Static Web Apps CI/CD

# main -> Production environment; staging -> "staging" branch environment.
# No pull_request trigger: new environments copy Production's settings (incl. the live GITHUB_PAT).
on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: azure-swa-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Stage categories.json for the API
        run: cp categories.json api/categories.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FIELD_0CD14C010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          production_branch: "main"
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true # static site; api/ is still built by Oryx
